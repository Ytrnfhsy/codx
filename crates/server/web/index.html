<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toon Warfare сервер</title>
<style>
  body { margin:0; font-family: system-ui, "Segoe UI", sans-serif; background:#1d2333; color:#f3f1ea; display:flex; justify-content:center; }
  .card { margin: 8vh 16px; max-width: 820px; width:100%; background:#283149; border-radius: 16px; padding: 22px 26px; box-shadow: 0 6px 0 #0006; }
  h1 { margin: 0 0 4px; color:#ffc94a; }
  .muted { color:#a8b0c8; }
  b { color:#ffc94a; }
  code { background:#111624; padding: 2px 6px; border-radius: 6px; }
  a { color:#5aa8ff; }
  .boards { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 10px; }
  .board { background:#1d2333; border-radius: 12px; padding: 10px 14px; }
  .board h3 { margin: 2px 0 8px; font-size: 15px; color:#ffc94a; }
  .board ol { margin:0; padding-left: 0; list-style: none; }
  .board li { display:flex; justify-content:space-between; gap: 8px; padding: 1px 0; }
  .board li span:last-child { color:#a8b0c8; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="card">
  <h1 id="name">Toon Warfare</h1>
  <div class="muted">Мультяшний мультиплеєрний шутер</div>
  <p id="info">Завантаження…</p>
  <p>Щоб приєднатися: запусти гру <b>Toon Warfare</b>, у полі «Адреса сервера» введи
    <code id="addr"></code> і натисни «Під'єднатися».</p>
  <p class="muted">Адміністратору: <a href="/admin">/admin</a></p>
  <h2>Рейтинг гравців</h2>
  <div id="boards" class="boards"><span class="muted">Завантаження…</span></div>
</div>
<script>
fetch("/api/info").then(r => r.json()).then(i => {
  document.getElementById("name").textContent = i.name;
  const p = document.getElementById("info");
  p.replaceChildren();
  const line = (k, v) => { const d = document.createElement("div"); d.textContent = k + ": "; const b = document.createElement("b"); b.textContent = v; d.append(b); p.append(d); };
  line("Карта", i.map); line("Режим", i.mode); line("Гравці", i.players + " (+" + i.bots + " ботів) / " + i.max_players);
  line("Рахунок", i.scores[0] + " : " + i.scores[1]); if (i.password) line("Вхід", "за паролем");
  document.getElementById("addr").textContent = location.hostname + ":" + i.port;
}).catch(() => { document.getElementById("info").textContent = "Сервер не відповідає"; });
fetch("/api/top").then(r => r.json()).then(boards => {
  const root = document.getElementById("boards");
  root.replaceChildren();
  for (const b of boards) {
    if (!b.rows.length) continue;
    const box = document.createElement("div"); box.className = "board";
    const h = document.createElement("h3"); h.textContent = b.title; box.append(h);
    const ol = document.createElement("ol");
    b.rows.forEach(([name, value], k) => {
      const li = document.createElement("li");
      const n = document.createElement("span"); n.textContent = (k + 1) + ". " + name;
      const v = document.createElement("span"); v.textContent = value;
      li.append(n, v); ol.append(li);
    });
    box.append(ol); root.append(box);
  }
  if (!root.children.length) root.textContent = "Ще ніхто не зіграв жодного матчу.";
}).catch(() => {});
</script>
</body>
</html>
