name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
            ext: ""
          - os: windows-latest
            name: windows-x64
            ext: ".exe"
          - os: macos-latest
            name: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/toon-warfare-${{ matrix.name }}
          cp target/release/toon-warfare${{ matrix.ext }} target/release/toon-server${{ matrix.ext }} dist/toon-warfare-${{ matrix.name }}/
          cp README.md server.example.json dist/toon-warfare-${{ matrix.name }}/
      - uses: actions/upload-artifact@v4
        with:
          name: toon-warfare-${{ matrix.name }}
          path: dist/toon-warfare-${{ matrix.name }}
