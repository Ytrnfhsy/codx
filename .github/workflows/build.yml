name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # the oldest runner: the game then needs no newer glibc than that system's
          # (a binary built on a new one refuses to start on an older one)
          - os: ubuntu-22.04
            name: linux-x64
            ext: ""
          - os: windows-latest
            name: windows-x64
            ext: ".exe"
          - os: macos-latest
            name: macos-arm64
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev musl-tools
          rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - name: Build
        shell: bash
        run: |
          # a v* tag is a release: its version goes into the game, and the game looks for
          # updates in this repository's releases
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export TW_VERSION="${GITHUB_REF_NAME#v}"
            export TW_UPDATE_REPO="$GITHUB_REPOSITORY"
          fi
          cargo build --release
          # the Linux server is linked statically (musl): one file that runs on any
          # distribution, whatever its glibc
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cargo build --release -p toon_server --target x86_64-unknown-linux-musl
            cp target/x86_64-unknown-linux-musl/release/toon-server target/release/toon-server
          fi
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/toon-warfare-${{ matrix.name }} release
          cp target/release/toon-warfare${{ matrix.ext }} target/release/toon-server${{ matrix.ext }} dist/toon-warfare-${{ matrix.name }}/
          cp README.md docs/GUIDE.md server.example.json dist/toon-warfare-${{ matrix.name }}/
          # the bare binaries are what the built-in updater downloads
          cp target/release/toon-warfare${{ matrix.ext }} release/toon-warfare-${{ matrix.name }}${{ matrix.ext }}
          cp target/release/toon-server${{ matrix.ext }} release/toon-server-${{ matrix.name }}${{ matrix.ext }}
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a -tzip ../release/toon-warfare-${{ matrix.name }}.zip toon-warfare-${{ matrix.name }}
          else
            tar czf ../release/toon-warfare-${{ matrix.name }}.tar.gz toon-warfare-${{ matrix.name }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: toon-warfare-${{ matrix.name }}
          path: dist/toon-warfare-${{ matrix.name }}
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: release

  # A v* tag publishes a GitHub release: archives for people, bare binaries for the updater
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
