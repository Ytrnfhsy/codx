[workspace]
resolver = "2"
members = ["crates/shared", "crates/server", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
glam = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# Fast-enough debug builds for a game
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# macroquad 0.4.16 with a fixed font atlas (see vendor/macroquad/src/text/atlas.rs,
# `cache_sprite`): the original grew it recursively and could overflow the stack or wrap
# the texture size around to 0, crashing the game at random while drawing text.
[patch.crates-io]
macroquad = { path = "vendor/macroquad" }

# Style lints that do not fit this code: map builders take many plain numbers, and
# index loops over several parallel arrays read better than zipped iterators.
[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
field_reassign_with_default = "allow"
