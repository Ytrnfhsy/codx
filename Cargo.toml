[workspace]
resolver = "2"
members = ["crates/shared", "crates/server", "crates/client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[workspace.dependencies]
glam = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

# Fast-enough debug builds for a game
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# macroquad 0.4.16 with a fixed font atlas (see vendor/macroquad/src/text/atlas.rs,
# `cache_sprite`): the original grew it recursively and could overflow the stack or wrap
# the texture size around to 0, crashing the game at random while drawing text.
[patch.crates-io]
macroquad = { path = "vendor/macroquad" }

# `deny`, not `forbid`: the client needs one unsafe call into macroquad (`mesh::quad_gl`),
# allowed there alone.
[workspace.lints.rust]
unsafe_code = "deny"
# Full paths where an import already names the thing are noise.
unused_qualifications = "warn"

[workspace.lints.clippy]
# Map builders and drawing helpers take many plain numbers (positions, sizes, colours);
# bundling them into structs only to please the lint would hide what each call draws.
too_many_arguments = "allow"
# Loops over several parallel arrays (boxes and their materials, the doors and whether
# they are open) read better by index than zipped.
needless_range_loop = "allow"
# Callback and tuple types in a few signatures (`Vec<(u8, Vec3, bool, bool)>`) are local
# and read fine where they stand; a type alias for each would be used once.
type_complexity = "allow"
# Protocol enums carry one big variant (a snapshot, a map) next to small ones by design;
# boxing them would add an allocation per message on the hot path.
large_enum_variant = "allow"
# Configs and tunings are built as `default()` and then a few fields set; struct-update
# syntax there hides which fields a test or a map changes.
field_reassign_with_default = "allow"
